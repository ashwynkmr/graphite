<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Option A, "Pencil G": a pencil drawing the G on an ink-blue ground -->
  <rect width="512" height="512" fill="#2c4a7c"/>
  <!-- faint ruled lines -->
  <g stroke="#f6f1e7" stroke-opacity="0.08" stroke-width="3">
    <path d="M0 136H512M0 216H512M0 296H512M0 376H512"/>
  </g>
  <!-- the G ring, open at the upper right -->
  <path d="M376 256A120 120 0 1 1 333.1 164.1" fill="none" stroke="#f6f1e7" stroke-width="44" stroke-linecap="round"/>
  <!-- crossbar as a pencil body -->
  <rect x="318" y="234" width="60" height="44" fill="#f6f1e7"/>
  <rect x="310" y="234" width="8" height="44" fill="#c9a24a"/>
  <!-- sharpened wood -->
  <path d="M310 234V278L262 256Z" fill="#e8cfa4"/>
  <!-- graphite point -->
  <path d="M276 249.6V262.4L262 256Z" fill="#2a2a2d"/>
</svg>
