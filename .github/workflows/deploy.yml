name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run content:validate
      - run: npm run build
      # The reminder server deploys separately, but a red server blocks the site like anything else.
      - run: npm ci
        working-directory: push-server
      - run: npm run typecheck
        working-directory: push-server
      - run: npm test
        working-directory: push-server
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
