name: Content problem
description: A question or word that looks wrong
title: "Content problem: "
labels: ["content"]
body:
  - type: input
    id: id
    attributes:
      label: Question or word ID
      description: Filled in for you when you tap Report a problem in the app.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What looks wrong?
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: What did you expect?
